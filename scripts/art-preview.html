<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,"><title>四个新动作 · 原生 WebP 检查</title>
<style>
*{box-sizing:border-box}body{font:16px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;background:#f3f5f7;color:#192838;margin:0;padding:32px}main{max-width:1100px;margin:auto}h1{font-size:28px;margin:0}p{color:#566573}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}article{background:white;padding:18px;border:1px solid #dce3e8;border-radius:12px}.motion{display:flex;align-items:center;justify-content:space-around;min-height:224px}.large{width:208px;height:208px}.small{width:84px;height:84px}.dark{background:#152233;color:#e8f0f8}.dark img{filter:invert(1)}button{font:inherit;margin:16px 8px 20px 0;padding:7px 16px;border:1px solid #aebac6;border-radius:6px;background:white;color:#24374a}h2{font-size:18px;margin:0}small{color:#78899b}@media(max-width:650px){body{padding:16px}.grid{grid-template-columns:1fr}.large{width:168px;height:168px}.small{width:60px;height:60px}}
@media(max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}.grid>article{min-width:0}.motion img{object-fit:contain;max-width:65%}
</style>
<main><h1>四个新动作 · 原生 WebP 播放</h1><p>实际播放时序 60 fps；左侧放大检查，右侧为状态栏尺寸。原画与补帧明确区分。</p><button id="pause">暂停</button><button id="theme">切换深色</button><section class="grid" id="gallery"></section></main>
<script>
const actions=[['scout','探泡','144 帧 · 2.4 秒'],['surge','疾游','120 帧 · 2 秒'],['flow','回旋','180 帧 · 3 秒'],['breathe','吐息','216 帧 · 3.6 秒']];
let paused=matchMedia('(prefers-reduced-motion: reduce)').matches;
for(const [key,name,timing] of actions){const card=document.createElement('article');card.innerHTML=`<h2>${name} <small>${timing}</small></h2><div class="motion"><img class="large" alt="${name}放大预览"><img class="small" alt="${name}实际尺寸"></div>`;for(const img of card.querySelectorAll('img'))img.dataset.state=key;document.querySelector('#gallery').append(card)}
function update(){for(const img of document.images)img.src=`../assets/whale-${img.dataset.state}.${paused?'png':'webp'}`;document.querySelector('#pause').textContent=paused?'播放':'暂停'}
document.querySelector('#pause').onclick=()=>{paused=!paused;update()};document.querySelector('#theme').onclick=()=>document.querySelectorAll('article').forEach(card=>card.classList.toggle('dark'));update();
</script></html>
