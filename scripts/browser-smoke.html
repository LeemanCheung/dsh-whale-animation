<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>dsh-whale-animation two-loop smoke</title>
  <script>
    if (new URLSearchParams(location.search).has('dark')) document.documentElement.dataset.theme = 'dark';
  </script>
  <style>
    :root { font-family: Inter, "Segoe UI", sans-serif; color: #12223b; background: #eef6ff; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 42px; background: linear-gradient(#f8fbff, #e9f4ff); }
    main { max-width: 760px; margin: auto; }
    h1 { margin: 0 0 8px; font-size: 34px; }
    p { color: #596d8a; margin: 0 0 30px; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 20px; }
    .card { min-height: 150px; padding: 28px 122px 28px 26px; background: #fff; border: 1px solid #dce9f7; border-radius: 22px; overflow: visible; }
    .tag { display: inline-block; margin-bottom: 20px; font-size: 11px; font-weight: 800; letter-spacing: .12em; color: #2d6cc4; }
    .smoke_turnStatus { display: inline-flex; align-items: center; height: 26px; font-size: 15px; font-weight: 650; white-space: nowrap; color: #19375f; }
    footer { margin-top: 24px; color: #6f829d; font-size: 13px; }
    html[data-theme="dark"] { color: #e7f1ff; background: #091321; }
    html[data-theme="dark"] body { background: linear-gradient(#0d1a2d, #08111e); }
    html[data-theme="dark"] .card { background: #111f33; border-color: #29425f; }
    html[data-theme="dark"] p, html[data-theme="dark"] footer { color: #9fb2cc; }
    html[data-theme="dark"] .smoke_turnStatus { color: #dbeaff; }
    @media (max-width: 600px) {
      body { padding: 20px; }
      h1 { font-size: 27px; }
      .grid { grid-template-columns: 1fr; }
      .card { padding: 22px 94px 22px 22px; }
    }
  </style>
  <script>window.__ModuleLoader__ = { load(value) { window.__loadedWhaleModule = value; } };</script>
  <script src="../lib/client.js"></script>
</head>
<body>
<main>
  <h1>Two preserved whale loops</h1>
  <p>Only the original Refined Dive and Classic assets are mounted.</p>
  <section class="grid">
    <article class="card"><span class="tag">REFINED DIVE · PRESERVED</span><br><div class="smoke_turnStatus" role="status">Analyzing the request...</div></article>
    <article class="card"><span class="tag">CLASSIC · PRESERVED</span><br><div class="smoke_turnStatus" role="status">Classic whale animation...</div></article>
  </section>
  <footer id="result">Initializing…</footer>
</main>
<script>
  const plugin = window.__loadedWhaleModule.factory(() => { throw new Error('No imports expected'); });
  plugin.apply({ effect(start) { window.__disposeWhale = start(); } });
  setTimeout(() => {
    const states = [...document.querySelectorAll('[role="status"]')].map(element => element.dataset.dshWhaleState);
    document.getElementById('result').textContent = `Detected states: ${states.join(' → ')}`;
    document.documentElement.dataset.smoke = states.join(',');
  }, 250);
</script>
</body>
</html>
