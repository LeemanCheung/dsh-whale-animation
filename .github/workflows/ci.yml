name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned raster verification dependencies
        run: python -m pip install -r requirements-art.txt
      - name: Verify ImageGen raster reconstruction
        run: npm run art:check
      - name: Build and verify six loops
        run: npm run verify
      - name: Verify committed build outputs
        run: git diff --exit-code -- assets/manifest.json lib/client.js
      - name: Run Chromium browser smoke test
        if: runner.os == 'Linux'
        run: bash scripts/check-browser.sh
      - name: Upload browser screenshots
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: whale-browser-smoke
          path: .artifacts/browser-smoke-*.png
          if-no-files-found: error
          include-hidden-files: true
      - name: Validate package contents
        run: npm run check:package
