name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build and verify two preserved loops
        run: npm run verify
      - name: Verify committed build outputs
        run: git diff --exit-code -- assets/manifest.json lib/client.js
      - name: Run Chromium browser smoke test
        run: bash scripts/check-browser.sh
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whale-browser-smoke
          path: .artifacts/browser-smoke-*.png
          if-no-files-found: error
          include-hidden-files: true
      - name: Validate package contents
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/npm-pack.txt
          if grep -E 'artwork-sources|docs/|whale-(spout|sonar|work|compose|idle|alert)' /tmp/npm-pack.txt; then
            echo "Non-original animation content leaked into the package" >&2
            exit 1
          fi
