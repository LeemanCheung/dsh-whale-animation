name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize v0.5.0 source
        run: python scripts/materialize-v050.py

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Regenerate animation and documentation assets
        run: npm run build:assets

      - name: Rebuild embedded browser client
        run: npm run build

      - name: Validate runtime, animation assets, and docs
        run: npm run check

      - name: Run Chromium browser smoke test
        run: bash scripts/check-browser.sh

      - name: Upload browser smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whale-browser-smoke
          path: .artifacts/browser-smoke-*.png
          if-no-files-found: error
          include-hidden-files: true

      - name: Validate package contents
        shell: bash
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/npm-pack.txt
          if grep -E '__pycache__|\.py[co]' /tmp/npm-pack.txt; then
            echo "Python cache files leaked into the package" >&2
            exit 1
          fi
