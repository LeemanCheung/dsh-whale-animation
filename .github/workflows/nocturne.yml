name: NOCTURNE mobile verification and publication
on:
  push:
    branches: [nocturne-site]
    paths:
      - '.github/workflows/nocturne.yml'
      - 'tests/**'
      - 'src/**'
      - 'index.html'
      - 'build.mjs'
      - 'server.mjs'
permissions:
  contents: write
concurrency:
  group: nocturne-site
  cancel-in-progress: false
jobs:
  verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nocturne-site
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build with same-origin pinned Three.js
        run: |
          node --check src/app.js
          npm install --ignore-scripts --no-audit --no-fund --no-save three@0.180.0
          mkdir -p vendor
          cp node_modules/three/build/three.module.min.js vendor/
          cp node_modules/three/build/three.core.min.js vendor/
          cp node_modules/three/LICENSE vendor/THREE-LICENSE.txt
          node build.mjs
      - name: Install test browsers
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium webkit
      - name: Test mobile layouts and real renderers
        run: |
          node server.mjs > /tmp/nocturne-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/ >/dev/null && break || sleep 1; done
          xvfb-run -a python tests/browser_checks.py
      - name: Publish verified files to isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp test-results/report.json TEST-REPORT-v1.1.json
          git add index.html src vendor build.mjs server.mjs LICENSE README.md tests NOCTURNE.html TEST-REPORT-v1.1.json .gitignore
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified NOCTURNE mobile site [skip ci]'
            git push origin HEAD:nocturne-site
          fi
          SHA=$(git rev-parse HEAD)
          URL="https://rawcdn.githack.com/LeemanCheung/dsh-whale-animation/$SHA/index.html"
          echo "NOCTURNE_PUBLIC_URL=$URL" >> "$GITHUB_ENV"
          printf '## Public site\n%s\n\nFirst visit: select Open the page on the hosting confirmation screen.\nMain and plugin releases are unchanged.\n' "$URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify public page in a normal browser
        run: |
          python -u - <<'PY'
          import asyncio, json, os, re
          from pathlib import Path
          from playwright.async_api import async_playwright
          url=os.environ['NOCTURNE_PUBLIC_URL']
          async def check():
              async with async_playwright() as p:
                  browser=await p.chromium.launch(args=['--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader'])
                  ctx=await browser.new_context(viewport={'width':390,'height':844},is_mobile=True,has_touch=True,reduced_motion='reduce')
                  page=await ctx.new_page()
                  errors=[]
                  page.on('pageerror',lambda e: errors.append(str(e)))
                  row={'url':url,'ok':False,'errors':errors}
                  try:
                      response=await page.goto(url,wait_until='domcontentloaded',timeout=60000)
                      row['status']=response.status if response else None
                      await page.wait_for_timeout(2000)
                      if not await page.evaluate('Boolean(window.__NOCTURNE__)'):
                          Path('test-results/public-entry.html').write_text(await page.content())
                          await page.screenshot(path='test-results/public-entry.png')
                          for role in ['button','link']:
                              controls=page.get_by_role(role,name=re.compile(r'continue|confirm|proceed|open|visit',re.I))
                              if await controls.count():
                                  row['confirmation']=await controls.first.inner_text()
                                  await controls.first.click()
                                  break
                      await page.wait_for_function('window.__NOCTURNE__ && __NOCTURNE__.state.rendererName === "Three.js r180"',timeout=60000)
                      await page.wait_for_timeout(2000)
                      assert not errors,errors
                      assert await page.evaluate('document.documentElement.scrollWidth<=innerWidth')
                      await page.screenshot(path='test-results/public-mobile.png')
                      await page.locator('[data-chapter="2"]').tap()
                      await page.wait_for_timeout(1500)
                      assert await page.evaluate('__NOCTURNE__.state.chapter===2')
                      await page.screenshot(path='test-results/public-third.png')
                      row.update(ok=True,engine='Three.js r180',viewport=[390,844],chapterSwitch=True)
                  finally:
                      Path('test-results/public-verification.json').write_text(json.dumps(row,indent=2))
                      if not row['ok']:
                          await page.screenshot(path='test-results/public-failure.png')
                          Path('test-results/public-failure.html').write_text(await page.content())
                      await browser.close()
          asyncio.run(check())
          PY
      - name: Package source
        if: always()
        run: |
          tar -czf NOCTURNE-1.1-source.tar.gz index.html src vendor build.mjs server.mjs LICENSE README.md tests NOCTURNE.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nocturne-release-and-verification
          path: |
            test-results/
            NOCTURNE-1.1-source.tar.gz
          retention-days: 30
