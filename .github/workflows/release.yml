name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag (must match package.json)
        required: true
        type: string
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build and verify release payload
        run: |
          npm run verify
          git diff --exit-code -- assets/manifest.json lib/client.js
      - name: Resolve immutable version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${INPUT_TAG:-$REF_TAG}"
          test "$TAG" = "v$VERSION"
          RELEASE_SHA="$(git rev-parse HEAD)"
          TAG_SHA="$(git rev-parse "refs/tags/$TAG^{commit}")"
          test "$TAG_SHA" = "$RELEASE_SHA"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
      - name: Build package archive
        id: pack
        run: |
          set -euo pipefail
          TARBALL="$(npm pack --silent)"
          if tar -tzf "$TARBALL" | grep -E 'artwork-sources|docs/|whale-(spout|sonar|work|compose|idle|alert)'; then exit 1; fi
          sha256sum "$TARBALL" > SHA256SUMS.txt
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          RELEASE_SHA: ${{ steps.version.outputs.release_sha }}
        run: |
          set -euo pipefail
          REMOTE_TAG_SHA="$(git ls-remote origin "refs/tags/$TAG^{}" | awk 'NR == 1 {print $1}')"
          if [ -z "$REMOTE_TAG_SHA" ]; then REMOTE_TAG_SHA="$(git ls-remote origin "refs/tags/$TAG" | awk 'NR == 1 {print $1}')"; fi
          test "$REMOTE_TAG_SHA" = "$RELEASE_SHA"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release $TAG already exists; refusing to overwrite it." >&2; exit 1; fi
          gh release create "$TAG" "$TARBALL" SHA256SUMS.txt --verify-tag --target "$RELEASE_SHA" --title "dsh-whale-animation $TAG" --generate-notes
